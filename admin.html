
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ক্রীড়াদিগন্ত | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:850px;margin:20px auto;padding:16px;background:#f1f5f9;color:#172033}
header{background:#073d2b;color:white;padding:20px;border-radius:12px}
.card{background:white;padding:18px;margin:16px 0;border-radius:12px;box-shadow:0 2px 10px #0000000b}
input,textarea,select,button{font:inherit;width:100%;padding:12px;margin:7px 0;border:1px solid #ccd3dc;border-radius:7px}
textarea{resize:vertical}
button{background:#087443;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
button.secondary{background:#34516b}
button.danger{background:#b42332}
button.light{background:#e8eef3;color:#172333}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:110px}
.item{border:1px solid #dbe2e8;border-radius:9px;padding:14px;margin:12px 0}
.item h3{margin:5px 0 8px;overflow-wrap:anywhere}
.meta,.note{font-size:13px;color:#526173;line-height:1.6}
.hidden{display:none!important}
label{display:block;margin-top:10px;font-weight:600}
.checkrow{display:flex;gap:10px;align-items:center}
.checkrow input{width:auto}
#message{white-space:pre-wrap;line-height:1.6}
.preview{max-width:100%;max-height:260px;display:block;margin:8px 0;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>ক্রীড়াদিগন্ত</h1>
<p>KRIRADIGANTA • সংবাদ ব্যবস্থাপনা প্যানেল</p>
</header>

<section class="card" id="loginBox">
<h2>অ্যাডমিন লগইন</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="অ্যাডমিন ইমেইল" autocomplete="username" required>
<input id="password" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
<button type="submit" id="loginBtn">লগইন</button>
</form>
</section>

<div id="adminBox" class="hidden">
<section class="card">
<div class="actions">
<h2 style="flex:2;margin:8px 0">সংবাদ ব্যবস্থাপনা</h2>
<button type="button" class="secondary" id="logoutBtn">লগআউট</button>
</div>

<h3 id="formHeading">নতুন সংবাদ লিখুন</h3>
<form id="newsForm">
<input type="hidden" id="newsId">

<label for="title">সংবাদের শিরোনাম *</label>
<input id="title" maxlength="300" required>

<label for="category">বিভাগ *</label>
<select id="category" required>
<option value="">বিভাগ নির্বাচন করুন</option>
<option>ফুটবল</option>
<option>ক্রিকেট</option>
<option>নারী ক্রীড়া</option>
<option>তৃণমূল ক্রীড়া</option>
<option>অন্যান্য খেলা</option>
</select>

<label for="summary">সংক্ষিপ্ত বিবরণ</label>
<textarea id="summary" rows="3"></textarea>

<label for="content">সম্পূর্ণ সংবাদ *</label>
<textarea id="content" rows="9" required></textarea>

<label for="imageFile">ছবি আপলোড</label>
<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<p class="note">JPG, PNG, WebP বা GIF; সর্বোচ্চ ৫০ MB।</p>
<img id="imagePreview" class="preview hidden" alt="ছবির প্রিভিউ">

<label for="image">ছবির URL</label>
<input id="image" type="url" placeholder="ছবি আপলোড করলে এখানে URL আসবে">

<label for="videoFile">ভিডিও আপলোড</label>
<input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime">
<p class="note">MP4, WebM বা MOV; সর্বোচ্চ ৫০ MB।</p>

<label for="video">ভিডিও URL</label>
<input id="video" type="url" placeholder="ভিডিও আপলোড করলে এখানে URL আসবে">

<label for="author">সংবাদদাতার নাম</label>
<input id="author">

<label class="checkrow">
<input id="published" type="checkbox">
<span>সরাসরি প্রকাশ করুন</span>
</label>

<div class="actions">
<button type="submit" id="saveBtn">সংবাদ সংরক্ষণ করুন</button>
<button type="button" id="cancelBtn" class="light hidden">সম্পাদনা বাতিল</button>
</div>
<p id="message" role="status"></p>
</form>
</section>

<section class="card">
<div class="actions">
<h2 style="flex:2;margin:8px 0">সংরক্ষিত সংবাদ</h2>
<button type="button" class="secondary" id="refreshBtn">রিফ্রেশ</button>
</div>
<div id="newsList">সংবাদ লোড হচ্ছে...</div>
</section>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL='https://tbktqpbvrqyoqjvdkesm.supabase.co';
const SUPABASE_KEY='sb_publishable_NAfSTNt2-L5m0yanG3UeBQ_Uh-9Bojv';
const BUCKET='news-media';
const MAX_SIZE=50*1024*1024;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

function message(t){$('message').textContent=t}
function makeSlug(t){
 return t.trim().toLowerCase().normalize('NFKD')
 .replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'')
 .slice(0,150)+'-'+Date.now();
}
function randomName(file){
 const ext=file.name.includes('.')?file.name.split('.').pop().toLowerCase():'bin';
 return Date.now()+'-'+crypto.randomUUID()+'.'+ext;
}

async function checkSession(){
 const {data,error}=await db.auth.getSession();
 if(error){console.error(error);return}
 if(data.session){
  if(data.session.user.app_metadata?.role==='admin')showAdmin();
  else await db.auth.signOut();
 }
}
function showAdmin(){
 $('loginBox').classList.add('hidden');
 $('adminBox').classList.remove('hidden');
 loadNews();
}

$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 $('loginBtn').disabled=true;
 try{
  const {data,error}=await db.auth.signInWithPassword({
   email:$('email').value.trim(),password:$('password').value
  });
  if(error)throw error;
  if(data.user?.app_metadata?.role!=='admin'){
   await db.auth.signOut();
   throw new Error('এই অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই।');
  }
  showAdmin();
 }catch(err){alert('লগইন হয়নি: '+err.message)}
 finally{$('loginBtn').disabled=false}
});

async function uploadFile(file,kind){
 if(!file)return null;
 if(file.size>MAX_SIZE)throw new Error('ফাইলটি ৫০ MB-এর বেশি।');
 const allowed=kind==='image'
  ?['image/jpeg','image/png','image/webp','image/gif']
  :['video/mp4','video/webm','video/quicktime'];
 if(!allowed.includes(file.type))
  throw new Error(kind==='image'?'সমর্থিত ছবি নির্বাচন করুন।':'MP4, WebM বা MOV ভিডিও নির্বাচন করুন।');

 const path=kind+'/'+randomName(file);
 message((kind==='image'?'ছবি':'ভিডিও')+' আপলোড হচ্ছে...');
 const {error}=await db.storage.from(BUCKET).upload(path,file,{
  cacheControl:'3600',upsert:false,contentType:file.type
 });
 if(error)throw new Error('আপলোড ব্যর্থ: '+error.message);
 return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

$('imageFile').addEventListener('change',()=>{
 const file=$('imageFile').files[0],preview=$('imagePreview');
 if(!file){preview.classList.add('hidden');return}
 if(!file.type.startsWith('image/')){
  alert('একটি ছবি নির্বাচন করুন।');$('imageFile').value='';return;
 }
 preview.src=URL.createObjectURL(file);
 preview.classList.remove('hidden');
});

function resetForm(){
 $('newsForm').reset();
 $('newsId').value='';
 $('formHeading').textContent='নতুন সংবাদ লিখুন';
 $('saveBtn').textContent='সংবাদ সংরক্ষণ করুন';
 $('cancelBtn').classList.add('hidden');
 $('imagePreview').classList.add('hidden');
 $('imagePreview').removeAttribute('src');
 message('');
}
$('cancelBtn').addEventListener('click',resetForm);

$('newsForm').addEventListener('submit',async e=>{
 e.preventDefault();
 $('saveBtn').disabled=true;
 try{
  const id=$('newsId').value;
  const title=$('title').value.trim();
  let imageUrl=$('image').value.trim()||null;
  let videoUrl=$('video').value.trim()||null;

  if($('imageFile').files[0]){
   imageUrl=await uploadFile($('imageFile').files[0],'image');
   $('image').value=imageUrl;
  }
  if($('videoFile').files[0]){
   videoUrl=await uploadFile($('videoFile').files[0],'video');
   $('video').value=videoUrl;
  }

  message('সংবাদ সংরক্ষণ হচ্ছে...');
  const article={
   title,category:$('category').value,
   summary:$('summary').value.trim()||null,
   content:$('content').value.trim(),
   image_url:imageUrl,video_url:videoUrl,
   author:$('author').value.trim()||null,
   published:$('published').checked
  };
  let result;
  if(id){
   result=await db.from('news').update(article).eq('id',Number(id)).select('id');
  }else{
   article.slug=makeSlug(title);
   result=await db.from('news').insert(article).select('id');
  }
  if(result.error)throw result.error;
  if(!result.data?.length)throw new Error('সংরক্ষণ নিশ্চিত হয়নি। অনুমতি পরীক্ষা করুন।');

  message(id?'সংবাদ আপডেট হয়েছে।':'সংবাদ সংরক্ষিত হয়েছে।');
  resetForm();
  await loadNews();
 }catch(err){message('সমস্যা: '+err.message)}
 finally{$('saveBtn').disabled=false}
});

async function loadNews(){
 $('newsList').textContent='সংবাদ লোড হচ্ছে...';
 const {data,error}=await db.from('news')
 .select('id,title,category,published,created_at')
 .order('created_at',{ascending:false}).limit(100);
 if(error){$('newsList').textContent='তালিকা লোড হয়নি: '+error.message;return}
 $('newsList').replaceChildren();
 if(!data.length){$('newsList').textContent='এখনো কোনো সংবাদ নেই।';return}

 data.forEach(item=>{
  const box=document.createElement('article');box.className='item';
  const h=document.createElement('h3');h.textContent=item.title;
  const meta=document.createElement('p');meta.className='meta';
  meta.textContent=item.category+' • '+(item.published?'প্রকাশিত':'খসড়া')+
   ' • '+new Date(item.created_at).toLocaleDateString('bn-BD');
  const actions=document.createElement('div');actions.className='actions';

  const edit=document.createElement('button');edit.type='button';
  edit.className='secondary';edit.textContent='সম্পাদনা';
  edit.addEventListener('click',()=>editNews(item.id));

  const vis=document.createElement('button');vis.type='button';
  vis.className='secondary';vis.textContent=item.published?'খসড়া করুন':'প্রকাশ করুন';
  vis.addEventListener('click',()=>togglePublished(item.id,!item.published));

  const del=document.createElement('button');del.type='button';
  del.className='danger';del.textContent='মুছে ফেলুন';
  del.addEventListener('click',()=>deleteNews(item.id,item.title));

  actions.append(edit,vis,del);box.append(h,meta,actions);$('newsList').append(box);
 });
}

async function editNews(id){
 message('সংবাদ খোঁজা হচ্ছে...');
 const {data,error}=await db.from('news').select('*').eq('id',id).single();
 if(error){message('সংবাদ খোলা যায়নি: '+error.message);return}
 $('newsId').value=data.id;
 $('title').value=data.title||'';
 $('category').value=data.category||'';
 $('summary').value=data.summary||'';
 $('content').value=data.content||'';
 $('image').value=data.image_url||'';
 $('video').value=data.video_url||'';
 $('author').value=data.author||'';
 $('published').checked=!!data.published;
 $('imageFile').value='';$('videoFile').value='';
 $('imagePreview').classList.add('hidden');
 $('formHeading').textContent='সংবাদ সম্পাদনা করুন';
 $('saveBtn').textContent='পরিবর্তন সংরক্ষণ করুন';
 $('cancelBtn').classList.remove('hidden');
 message('সংবাদ সম্পাদনার জন্য প্রস্তুত।');
 window.scrollTo({top:0,behavior:'smooth'});
}

async function togglePublished(id,published){
 if(!confirm('সংবাদটি '+(published?'প্রকাশ':'খসড়া')+' করতে চান?'))return;
 const {data,error}=await db.from('news').update({published}).eq('id',id).select('id');
 if(error){alert('পরিবর্তন হয়নি: '+error.message);return}
 if(!data?.length){alert('অনুমতি পরীক্ষা করুন।');return}
 await loadNews();
}

async function deleteNews(id,title){
 if(!confirm('সংবাদটি স্থায়ীভাবে মুছে ফেলতে চান?\n\n'+title))return;
 const {data,error}=await db.from('news').delete().eq('id',id).select('id');
 if(error){alert('মুছে ফেলা যায়নি: '+error.message);return}
 if(!data?.length){alert('মুছে ফেলার অনুমতি পাওয়া যায়নি।');return}
 if($('newsId').value===String(id))resetForm();
 alert('সংবাদ ডেটাবেস থেকে মুছে ফেলা হয়েছে।');
 await loadNews();
}

$('refreshBtn').addEventListener('click',loadNews);
$('logoutBtn').addEventListener('click',async()=>{
 await db.auth.signOut();location.reload();
});
checkSession();
</script>
</body>
</html>
