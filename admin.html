<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ক্রীড়াদিগন্ত | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;max-width:850px;margin:20px auto;padding:16px;background:#f1f5f9;color:#172033}
header{background:#073d2b;color:white;padding:20px;border-radius:12px}
.card{background:white;padding:18px;margin:16px 0;border-radius:12px;box-shadow:0 2px 10px #0000000b}
input,textarea,select,button{font:inherit;width:100%;padding:12px;margin:7px 0;border:1px solid #ccd3dc;border-radius:7px}
textarea{resize:vertical}
button{background:#087443;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#34516b}
button.danger{background:#b42332}
button.light{background:#e8eef3;color:#172333}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1;min-width:110px}
.item{border:1px solid #dbe2e8;border-radius:9px;padding:14px;margin:12px 0}
.item h3{margin:5px 0 8px;overflow-wrap:anywhere}
.meta{font-size:13px;color:#526173}
.status{font-size:13px;font-weight:bold}
.hidden{display:none!important}
label{display:block;margin-top:10px}
.checkrow{display:flex;gap:10px;align-items:center}
.checkrow input{width:auto}
#message{white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>

<header>
<h1>ক্রীড়াদিগন্ত</h1>
<p>KRIRADIGANTA • সংবাদ ব্যবস্থাপনা প্যানেল</p>
</header>

<section class="card" id="loginBox">
<h2>অ্যাডমিন লগইন</h2>
<form id="loginForm">
<input id="email" type="email" placeholder="অ্যাডমিন ইমেইল" autocomplete="username" required>
<input id="password" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
<button type="submit">লগইন</button>
</form>
</section>

<div id="adminBox" class="hidden">
<section class="card">
<div class="actions">
<h2 style="flex:2;margin:8px 0">সংবাদ ব্যবস্থাপনা</h2>
<button type="button" class="secondary" id="logoutBtn">লগআউট</button>
</div>

<h3 id="formHeading">নতুন সংবাদ লিখুন</h3>
<form id="newsForm">
<input type="hidden" id="newsId">

<label for="title">সংবাদের শিরোনাম *</label>
<input id="title" maxlength="300" placeholder="সংবাদের শিরোনাম" required>

<label for="category">বিভাগ *</label>
<select id="category" required>
<option value="">বিভাগ নির্বাচন করুন</option>
<option value="ফুটবল">ফুটবল</option>
<option value="ক্রিকেট">ক্রিকেট</option>
<option value="নারী ক্রীড়া">নারী ক্রীড়া</option>
<option value="তৃণমূল ক্রীড়া">তৃণমূল ক্রীড়া</option>
<option value="অন্যান্য খেলা">অন্যান্য খেলা</option>
</select>

<label for="summary">সংক্ষিপ্ত বিবরণ</label>
<textarea id="summary" rows="3" placeholder="সংবাদের সারাংশ"></textarea>

<label for="content">সম্পূর্ণ সংবাদ *</label>
<textarea id="content" rows="9" placeholder="সংবাদের সম্পূর্ণ লেখা" required></textarea>

<label for="image">ছবির URL (ঐচ্ছিক)</label>
<input id="image" type="url" placeholder="https://example.com/image.jpg">

<label for="author">সংবাদদাতার নাম</label>
<input id="author" placeholder="সংবাদদাতার নাম">

<label class="checkrow">
<input id="published" type="checkbox">
<span>সরাসরি প্রকাশ করুন</span>
</label>

<div class="actions">
<button type="submit" id="saveBtn">সংবাদ সংরক্ষণ করুন</button>
<button type="button" id="cancelBtn" class="light hidden">সম্পাদনা বাতিল</button>
</div>
<p id="message" role="status"></p>
</form>
</section>

<section class="card">
<div class="actions">
<h2 style="flex:2;margin:8px 0">সংরক্ষিত সংবাদ</h2>
<button type="button" class="secondary" id="refreshBtn">রিফ্রেশ</button>
</div>
<p class="meta">সম্পাদনা করতে সংবাদ নির্বাচন করুন। মুছে ফেললে সংবাদ স্থায়ীভাবে ডেটাবেস থেকে মুছে যাবে।</p>
<div id="newsList">সংবাদ তালিকা লোড হচ্ছে...</div>
</section>
</div>

<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
'https://tbktqpbvrqyoqjvdkesm.supabase.co';

const SUPABASE_KEY =
'sb_publishable_NAfSTNt2-L5m0yanG3UeBQ_Uh-9Bojv';

const db = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function message(text) {
  $('message').textContent = text;
}

function makeSlug(title) {
  return title.trim().toLowerCase()
    .normalize('NFKD')
    .replace(/[^\p{L}\p{N}]+/gu, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 150) + '-' + Date.now();
}

async function checkSession() {
  const { data, error } = await db.auth.getSession();
  if (error) return;

  if (data.session) {
    const user = data.session.user;
    if (user.app_metadata?.role === 'admin') {
      showAdmin();
    } else {
      await db.auth.signOut();
    }
  }
}

function showAdmin() {
  $('loginBox').classList.add('hidden');
  $('adminBox').classList.remove('hidden');
  loadNews();
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();

  const { data, error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });

  if (error) {
    alert('লগইন হয়নি: ' + error.message);
    return;
  }

  if (data.user?.app_metadata?.role !== 'admin') {
    await db.auth.signOut();
    alert('এই অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই।');
    return;
  }

  showAdmin();
});

function resetForm() {
  $('newsForm').reset();
  $('newsId').value = '';
  $('formHeading').textContent = 'নতুন সংবাদ লিখুন';
  $('saveBtn').textContent = 'সংবাদ সংরক্ষণ করুন';
  $('cancelBtn').classList.add('hidden');
  message('');
}

$('cancelBtn').addEventListener('click', resetForm);

$('newsForm').addEventListener('submit', async event => {
  event.preventDefault();
  $('saveBtn').disabled = true;
  message('সংরক্ষণ হচ্ছে...');

  const id = $('newsId').value;
  const title = $('title').value.trim();

  const article = {
    title,
    category: $('category').value,
    summary: $('summary').value.trim() || null,
    content: $('content').value.trim(),
    image_url: $('image').value.trim() || null,
    author: $('author').value.trim() || null,
    published: $('published').checked
  };

  let result;

  if (id) {
    result = await db.from('news')
      .update(article)
      .eq('id', Number(id))
      .select('id');
  } else {
    article.slug = makeSlug(title);
    result = await db.from('news')
      .insert(article)
      .select('id');
  }

  $('saveBtn').disabled = false;

  if (result.error) {
    message('সংরক্ষণ ব্যর্থ: ' + result.error.message);
    return;
  }

  if (!result.data || result.data.length === 0) {
    message('পরিবর্তন নিশ্চিত করা যায়নি। অ্যাডমিন অনুমতি পরীক্ষা করুন।');
    return;
  }

  message(id ? 'সংবাদ সফলভাবে আপডেট হয়েছে।' : 'সংবাদ সফলভাবে সংরক্ষিত হয়েছে।');
  resetForm();
  await loadNews();
});

async function loadNews() {
  $('newsList').textContent = 'সংবাদ লোড হচ্ছে...';

  const { data, error } = await db.from('news')
    .select('id,title,category,published,created_at')
    .order('created_at', { ascending: false })
    .limit(100);

  if (error) {
    $('newsList').textContent = 'তালিকা লোড হয়নি: ' + error.message;
    return;
  }

  $('newsList').replaceChildren();

  if (!data.length) {
    $('newsList').textContent = 'এখনো কোনো সংবাদ নেই।';
    return;
  }

  data.forEach(item => {
    const box = document.createElement('article');
    box.className = 'item';

    const title = document.createElement('h3');
    title.textContent = item.title;

    const meta = document.createElement('p');
    meta.className = 'meta';
    meta.textContent = item.category + ' • ' +
      (item.published ? 'প্রকাশিত' : 'খসড়া') + ' • ' +
      new Date(item.created_at).toLocaleDateString('bn-BD');

    const actions = document.createElement('div');
    actions.className = 'actions';

    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'secondary';
    edit.textContent = 'সম্পাদনা';
    edit.addEventListener('click', () => editNews(item.id));

    const visibility = document.createElement('button');
    visibility.type = 'button';
    visibility.className = 'secondary';
    visibility.textContent = item.published ? 'খসড়া করুন' : 'প্রকাশ করুন';
    visibility.addEventListener('click', () =>
      togglePublished(item.id, !item.published)
    );

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'danger';
    remove.textContent = 'মুছে ফেলুন';
    remove.addEventListener('click', () => deleteNews(item.id, item.title));

    actions.append(edit, visibility, remove);
    box.append(title, meta, actions);
    $('newsList').append(box);
  });
}

async function editNews(id) {
  message('সংবাদ খোঁজা হচ্ছে...');

  const { data, error } = await db.from('news')
    .select('*')
    .eq('id', id)
    .single();

  if (error) {
    message('সংবাদ খোলা যায়নি: ' + error.message);
    return;
  }

  $('newsId').value = data.id;
  $('title').value = data.title || '';
  $('category').value = data.category || '';
  $('summary').value = data.summary || '';
  $('content').value = data.content || '';
  $('image').value = data.image_url || '';
  $('author').value = data.author || '';
  $('published').checked = !!data.published;

  $('formHeading').textContent = 'সংবাদ সম্পাদনা করুন';
  $('saveBtn').textContent = 'পরিবর্তন সংরক্ষণ করুন';
  $('cancelBtn').classList.remove('hidden');
  message('সংবাদ সম্পাদনার জন্য প্রস্তুত।');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function togglePublished(id, published) {
  const verb = published ? 'প্রকাশ' : 'খসড়া';
  if (!confirm('সংবাদটি ' + verb + ' করতে চান?')) return;

  const { data, error } = await db.from('news')
    .update({ published })
    .eq('id', id)
    .select('id');

  if (error) {
    alert('পরিবর্তন হয়নি: ' + error.message);
    return;
  }

  if (!data || !data.length) {
    alert('পরিবর্তন নিশ্চিত করা যায়নি। অ্যাডমিন অনুমতি পরীক্ষা করুন।');
    return;
  }

  await loadNews();
}

async function deleteNews(id, title) {
  if (!confirm('আপনি কি এই সংবাদটি স্থায়ীভাবে মুছে ফেলতে চান?\n\n' + title)) return;

  const { data, error } = await db.from('news')
    .delete()
    .eq('id', id)
    .select('id');

  if (error) {
    alert('সংবাদ মুছে ফেলা যায়নি: ' + error.message);
    return;
  }

  if (!data || !data.length) {
    alert('সংবাদ মুছে ফেলার অনুমতি পাওয়া যায়নি।');
    return;
  }

  if ($('newsId').value === String(id)) resetForm();
  alert('সংবাদ মুছে ফেলা হয়েছে।');
  await loadNews();
}

$('refreshBtn').addEventListener('click', loadNews);

$('logoutBtn').addEventListener('click', async () => {
  await db.auth.signOut();
  location.reload();
});

checkSession();
</script>
</body>
</html>
