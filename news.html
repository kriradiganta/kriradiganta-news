
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d35">
  <title>সংবাদ | ক্রীড়াদিগন্ত</title>
  <meta name="description" content="ক্রীড়াদিগন্তের সর্বশেষ ক্রীড়া সংবাদ।">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f3f5f8;
      color: #172238;
      line-height: 1.8;
    }
    header {
      background: #101d35;
      color: white;
      padding: 18px 16px;
      border-bottom: 4px solid #e63946;
    }
    .head, main, footer {
      max-width: 900px;
      margin: auto;
    }
    .brand { font-size: 25px; font-weight: 800; }
    .english { font-size: 12px; letter-spacing: 2px; }
    nav { margin-top: 10px; }
    nav a { color: white; text-decoration: none; margin-right: 15px; }
    main { padding: 20px 15px; min-height: 65vh; }
    .back { color: #c62836; font-weight: bold; }
    article {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 14px #17223812;
    }
    h1 { line-height: 1.5; font-size: 30px; margin: 8px 0; }
    .meta { color: #667085; font-size: 14px; }
    .hero {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      border-radius: 8px;
      margin: 16px 0;
    }
    .summary {
      font-size: 18px;
      font-weight: bold;
      color: #36445a;
      border-left: 4px solid #e63946;
      padding-left: 12px;
    }
    #content { white-space: pre-wrap; overflow-wrap: anywhere; }
    .message { text-align: center; padding: 40px 12px; }
    footer {
      padding: 20px 15px;
      color: #667085;
      font-size: 13px;
    }
    @media (max-width: 600px) {
      h1 { font-size: 24px; }
      article { padding: 16px; }
    }
  </style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">ক্রীড়াদিগন্ত</div>
    <div class="english">KRIRADIGANTA • SPORTS NEWS</div>
    <div>তৃণমূল থেকে জাতীয় ক্রীড়াঙ্গন</div>
    <nav>
      <a href="./index.html">প্রচ্ছদ</a>
      <a href="./index.html#news-list">সর্বশেষ সংবাদ</a>
    </nav>
  </div>
</header>

<main>
  <a class="back" href="./index.html">← প্রচ্ছদে ফিরে যান</a>
  <div id="news" class="message">সংবাদ লোড হচ্ছে...</div>
</main>

<footer>
  © <span id="year"></span> ক্রীড়াদিগন্ত (KRIRADIGANTA)
  • তৃণমূল থেকে জাতীয় ক্রীড়াঙ্গন
</footer>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const db = createClient(
    'https://tbktqpbvrqyoqjvdkesm.supabase.co',
    'sb_publishable_NAfSTNt2-L5m0yanG3UeBQ_Uh-9Bojv'
  );

  const area = document.getElementById('news');
  document.getElementById('year').textContent =
    new Date().getFullYear();

  function safeText(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch]);
  }

  function safeImageUrl(value) {
    try {
      const u = new URL(value);
      return ['https:', 'http:'].includes(u.protocol) ? u.href : '';
    } catch {
      return '';
    }
  }

  async function loadNews() {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const slug = params.get('slug');

    if ((!id && !slug) ||
        (id && !/^\d+$/.test(id)) ||
        (slug && slug.length > 200)) {
      area.innerHTML =
        '<div class="message">সংবাদ খুঁজে পাওয়া যায়নি। ' +
        '<p><a href="./index.html">প্রচ্ছদে ফিরে যান</a></p></div>';
      return;
    }

    let query = db.from('news')
      .select('id,title,category,summary,content,image_url,author,created_at')
      .eq('published', true);

    query = id ? query.eq('id', Number(id)) : query.eq('slug', slug);

    const { data, error } = await query.maybeSingle();

    if (error) {
      area.innerHTML =
        '<div class="message">সংবাদ লোড করা যায়নি। ' +
        'ইন্টারনেট সংযোগ দিয়ে আবার চেষ্টা করুন।</div>';
      return;
    }

    if (!data) {
      area.innerHTML =
        '<div class="message">এই সংবাদটি পাওয়া যায়নি অথবা এটি প্রকাশিত নয়।' +
        '<p><a href="./index.html">প্রচ্ছদে ফিরে যান</a></p></div>';
      return;
    }

    const title = safeText(data.title);
    const category = safeText(data.category);
    const summary = safeText(data.summary);
    const content = safeText(data.content);
    const author = safeText(data.author || 'ক্রীড়াদিগন্ত ডেস্ক');
    const date = data.created_at
      ? new Date(data.created_at).toLocaleDateString('bn-BD', {
          year: 'numeric', month: 'long', day: 'numeric'
        })
      : '';

    const imageUrl = safeImageUrl(data.image_url);
    const image = imageUrl
      ? `<img class="hero" src="${safeText(imageUrl)}"
          alt="${title}" loading="lazy">`
      : '';

    area.className = '';
    area.innerHTML = `
      <article>
        <div class="meta">${category}</div>
        <h1>${title}</h1>
        <div class="meta">${date} • সংবাদদাতা: ${author}</div>
        ${image}
        ${summary ? `<p class="summary">${summary}</p>` : ''}
        <div id="content">${content}</div>
        <hr>
        <p><a class="back" href="./index.html">← আরও সংবাদ পড়ুন</a></p>
      </article>
    `;

    document.title = `${data.title} | ক্রীড়াদিগন্ত`;
  }

  loadNews();
</script>
</body>
</html>
