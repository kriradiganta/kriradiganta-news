
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#063b2b">
  <meta name="robots" content="index, follow, max-image-preview:large">

  <title>সংবাদ | ক্রীড়াদিগন্ত</title>
  <meta name="description" content="ক্রীড়াদিগন্তে পড়ুন বাংলাদেশের তৃণমূল থেকে জাতীয় পর্যায়ের সর্বশেষ ক্রীড়া সংবাদ।">

  <link rel="canonical" href="https://kriradiganta-news.vercel.app/news.html">

  <meta property="og:site_name" content="ক্রীড়াদিগন্ত">
  <meta property="og:locale" content="bn_BD">
  <meta property="og:type" content="article">
  <meta property="og:title" content="সংবাদ | ক্রীড়াদিগন্ত">
  <meta property="og:description" content="তৃণমূল থেকে জাতীয় ক্রীড়াঙ্গনের সংবাদ">
  <meta property="og:url" content="https://kriradiganta-news.vercel.app/news.html">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="সংবাদ | ক্রীড়াদিগন্ত">
  <meta name="twitter:description" content="তৃণমূল থেকে জাতীয় ক্রীড়াঙ্গনের সংবাদ">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f7f5;
      color: #202923;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      line-height: 1.8;
    }

    header {
      background: #063b2b;
      color: white;
      padding: 18px 16px;
    }

    .header-inner, main, footer {
      max-width: 900px;
      margin: auto;
    }

    .brand {
      color: white;
      font-size: 25px;
      font-weight: bold;
      text-decoration: none;
    }

    .tagline {
      margin: 0;
      font-size: 13px;
      color: #d9eee2;
    }

    nav { margin-top: 8px; }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 16px;
      font-size: 14px;
    }

    main {
      padding: 20px 14px 36px;
      min-height: 65vh;
    }

    article {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0000000b;
    }

    .category {
      display: inline-block;
      background: #e4f4eb;
      color: #075d39;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(25px, 5vw, 36px);
      line-height: 1.5;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .summary {
      font-size: 18px;
      color: #49564d;
      border-left: 4px solid #16834c;
      padding-left: 14px;
    }

    .meta {
      color: #657168;
      font-size: 14px;
      margin: 14px 0;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
      border-radius: 8px;
      margin: 18px 0;
    }

    .video-section {
      margin: 22px 0;
    }

    .video-heading {
      color: #075d39;
      font-size: 20px;
      margin: 0 0 10px;
    }

    .video-player {
      display: block;
      width: 100%;
      max-height: 520px;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 10px;
    }

    .content {
      font-size: 18px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .content p { margin: 0 0 18px; }

    .share {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #e5eae6;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      background: #087443;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { background: #065c35; }

    .back {
      display: inline-block;
      margin-bottom: 16px;
      color: #086b40;
      text-decoration: none;
    }

    #message {
      padding: 30px 5px;
      text-align: center;
    }

    footer {
      padding: 22px 14px;
      text-align: center;
      color: #657168;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      article { padding: 16px; }
      .content { font-size: 17px; }
      .video-player { max-height: 360px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="/">ক্রীড়াদিগন্ত</a>
      <p class="tagline">From Grassroots to National Sports</p>
      <nav>
        <a href="/">হোম</a>
        <a href="/#news">সর্বশেষ সংবাদ</a>
      </nav>
    </div>
  </header>

  <main>
    <a class="back" href="/">← সব সংবাদে ফিরে যান</a>

    <div id="message" role="status">সংবাদ লোড হচ্ছে...</div>

    <article id="article" hidden>
      <span class="category" id="category"></span>
      <h1 id="title"></h1>
      <p class="summary" id="summary" hidden></p>
      <div class="meta" id="meta"></div>

      <img class="cover" id="cover" alt="" hidden>

      <section class="video-section" id="videoSection" hidden>
        <h2 class="video-heading">ভিডিও সংবাদ</h2>
        <video
          class="video-player"
          id="videoPlayer"
          controls
          playsinline
          preload="metadata"
        >
          আপনার ব্রাউজার ভিডিও চালাতে সমর্থ নয়।
        </video>
      </section>

      <div class="content" id="content"></div>

      <div class="share">
        <button id="shareBtn" type="button">সংবাদ শেয়ার করুন</button>
        <button id="copyBtn" type="button">লিংক কপি করুন</button>
      </div>
    </article>
  </main>

  <footer>
    © <span id="year"></span> ক্রীড়াদিগন্ত | সর্বস্বত্ব সংরক্ষিত
  </footer>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://tbktqpbvrqyoqjvdkesm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NAfSTNt2-L5m0yanG3UeBQ_Uh-9Bojv";

    const SITE_URL = "https://kriradiganta-news.vercel.app";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);

    $("year").textContent = new Date().getFullYear();

    function setMeta(selector, attribute, value) {
      let element = document.head.querySelector(selector);

      if (!element) {
        element = document.createElement("meta");
        const match = selector.match(/(name|property)="([^"]+)"/);
        if (match) element.setAttribute(match[1], match[2]);
        document.head.appendChild(element);
      }

      element.setAttribute(attribute, value || "");
    }

    function setCanonical(url) {
      let link = document.querySelector('link[rel="canonical"]');

      if (!link) {
        link = document.createElement("link");
        link.rel = "canonical";
        document.head.appendChild(link);
      }

      link.href = url;
    }

    function safeMediaURL(value) {
      if (!value || typeof value !== "string") return "";

      try {
        const url = new URL(value, SITE_URL);

        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch (_) {}

      return "";
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";

      return new Intl.DateTimeFormat("bn-BD", {
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(date);
    }

    function setArticleSchema(data, canonical, imageURL, videoURL) {
      let schema = document.getElementById("newsArticleSchema");

      if (!schema) {
        schema = document.createElement("script");
        schema.type = "application/ld+json";
        schema.id = "newsArticleSchema";
        document.head.appendChild(schema);
      }

      const articleSchema = {
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "headline": data.title,
        "description": data.summary || data.title,
        "inLanguage": "bn",
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": canonical
        },
        "datePublished": data.created_at || undefined,
        "dateModified": data.created_at || undefined,
        "author": {
          "@type": "Organization",
          "name": data.author || "ক্রীড়াদিগন্ত ডেস্ক"
        },
        "publisher": {
          "@type": "Organization",
          "name": "ক্রীড়াদিগন্ত",
          "url": SITE_URL
        },
        "image": imageURL ? [imageURL] : undefined,
        "video": videoURL ? {
          "@type": "VideoObject",
          "name": data.title,
          "description": data.summary || data.title,
          "contentUrl": videoURL,
          "uploadDate": data.created_at || undefined,
          "thumbnailUrl": imageURL || undefined
        } : undefined
      };

      schema.textContent = JSON.stringify(articleSchema);
    }

    async function loadNews() {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const slug = params.get("slug");

      if (
        (!id && !slug) ||
        (id && !/^\d+$/.test(id)) ||
        (slug && slug.length > 200)
      ) {
        $("message").textContent = "সংবাদটি খুঁজে পাওয়া যায়নি।";
        return;
      }

      let query = supabase
        .from("news")
        .select(
          "id,title,slug,category,summary,content,image_url,video_url,author,created_at"
        )
        .eq("published", true);

      query = id
        ? query.eq("id", Number(id))
        : query.eq("slug", slug);

      const { data, error } = await query.maybeSingle();

      if (error || !data) {
        console.error("News load error:", error);
        $("message").textContent =
          "সংবাদটি পাওয়া যায়নি অথবা বর্তমানে প্রকাশিত নয়।";
        return;
      }

      const title = data.title || "সংবাদ";
      const description = (data.summary || data.title || "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 300);

      const canonical = `${SITE_URL}/news.html?id=${data.id}`;
      const imageURL = safeMediaURL(data.image_url);
      const videoURL = safeMediaURL(data.video_url);

      document.title = `${title} | ক্রীড়াদিগন্ত`;

      setMeta('meta[name="description"]', "content", description);
      setMeta('meta[property="og:type"]', "content", "article");
      setMeta('meta[property="og:title"]', "content", title);
      setMeta('meta[property="og:description"]', "content", description);
      setMeta('meta[property="og:url"]', "content", canonical);
      setMeta('meta[property="og:site_name"]', "content", "ক্রীড়াদিগন্ত");
      setMeta('meta[property="og:locale"]', "content", "bn_BD");
      setMeta('meta[property="og:image"]', "content", imageURL);

      setMeta(
        'meta[name="twitter:card"]',
        "content",
        imageURL ? "summary_large_image" : "summary"
      );
      setMeta('meta[name="twitter:title"]', "content", title);
      setMeta('meta[name="twitter:description"]', "content", description);

      if (imageURL) {
        setMeta('meta[name="twitter:image"]', "content", imageURL);
      }

      setCanonical(canonical);
      setArticleSchema(data, canonical, imageURL, videoURL);

      $("category").textContent = data.category || "ক্রীড়া সংবাদ";
      $("title").textContent = title;

      if (data.summary) {
        $("summary").textContent = data.summary;
        $("summary").hidden = false;
      } else {
        $("summary").hidden = true;
      }

      const author = data.author || "ক্রীড়াদিগন্ত ডেস্ক";
      const date = formatDate(data.created_at);

      $("meta").textContent =
        `প্রকাশক: ${author}${date ? " · প্রকাশের তারিখ: " + date : ""}`;

      const cover = $("cover");

      if (imageURL) {
        cover.src = imageURL;
        cover.alt = title;
        cover.hidden = false;
      } else {
        cover.removeAttribute("src");
        cover.alt = "";
        cover.hidden = true;
      }

      const videoSection = $("videoSection");
      const videoPlayer = $("videoPlayer");

      if (videoURL) {
        videoPlayer.src = videoURL;
        videoPlayer.poster = imageURL || "";
        videoSection.hidden = false;

        videoPlayer.onerror = () => {
          console.error("ভিডিও চালানো যায়নি:", videoURL);
        };
      } else {
        videoPlayer.pause();
        videoPlayer.removeAttribute("src");
        videoPlayer.removeAttribute("poster");
        videoPlayer.load();
        videoSection.hidden = true;
      }

      // সংবাদকে সাধারণ টেক্সট হিসেবে দেখানো হয়।
      $("content").textContent = data.content || "";

      $("message").hidden = true;
      $("article").hidden = false;

      $("shareBtn").addEventListener("click", async () => {
        const shareData = {
          title,
          text: description,
          url: canonical
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else {
            await navigator.clipboard.writeText(canonical);
            alert("সংবাদের লিংক কপি হয়েছে।");
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            alert("শেয়ার করা যায়নি। লিংক কপি করে শেয়ার করুন।");
          }
        }
      });

      $("copyBtn").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(canonical);
          alert("সংবাদের লিংক কপি হয়েছে।");
        } catch (_) {
          prompt("লিংক কপি করুন:", canonical);
        }
      });
    }

    loadNews().catch((error) => {
      console.error("Unexpected news error:", error);
      $("message").textContent =
        "সংবাদ লোড করা যায়নি। ইন্টারনেট সংযোগ দিয়ে আবার চেষ্টা করুন।";
    });
  </script>
</body>
</html>
